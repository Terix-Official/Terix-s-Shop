<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Košík | Terix's Shop</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                "SF Pro Text", Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        header {
            background: rgba(255,255,255,.95);
            border-bottom: 1px solid #e5e5e7;
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        header a {
            text-decoration: none;
            color: #1d1d1f;
            font-size: 14px;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 70px 25px;
        }

        h1 {
            font-size: 48px;
            letter-spacing: -2px;
            margin-bottom: 35px;
        }

        .cart {
            background: white;
            border-radius: 28px;
            padding: 30px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e5e7;
            padding: 20px 0;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item h2 {
            font-size: 20px;
        }

        .item p {
            color: #6e6e73;
            margin-top: 5px;
        }

        .remove {
            background: #f5f5f7;
            border: none;
            padding: 9px 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        .total {
            border-top: 1px solid #e5e5e7;
            margin-top: 25px;
            padding-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: 700;
        }

        .order {
            display: block;
            text-align: center;
            background: #0071e3;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 28px;
            margin-top: 25px;
            font-weight: 600;
        }

        .empty {
            color: #6e6e73;
            text-align: center;
            padding: 40px;
        }

        footer {
            text-align: center;
            background: #1d1d1f;
            color: white;
            padding: 40px;
            margin-top: 50px;
        }

        footer p {
            color: #a1a1a6;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">TERIX</div>

    <a href="index.html">← Pokračovat v nákupu</a>

</header>


<main>

    <h1>Košík</h1>

    <div class="cart">

        <div id="cart-items"></div>

        <div class="total">

            <span>Celkem</span>

            <span id="total">0 Kč</span>

        </div>

        <a href="#" class="order">
            Pokračovat k objednávce
        </a>

    </div>

</main>


<footer>

    <strong>TERIX'S SHOP</strong>

    <p>
        © 2026 Terix's Shop • Nejsme oficiálně spojeni se společností Apple.
    </p>

</footer>


<script>

    const cart = JSON.parse(localStorage.getItem("terixCart")) || [];

    const container = document.getElementById("cart-items");
    const totalElement = document.getElementById("total");

    function renderCart() {

        container.innerHTML = "";

        if (cart.length === 0) {

            container.innerHTML =
                '<div class="empty">Košík je zatím prázdný.</div>';

            totalElement.textContent = "0 Kč";

            return;
        }

        let total = 0;

        cart.forEach((item, index) => {

            total += item.price;

            const div = document.createElement("div");

            div.className = "item";

            div.innerHTML = `
                <div>
                    <h2>${item.name}</h2>
                    <p>${item.price.toLocaleString("cs-CZ")} Kč</p>
                </div>

                <button class="remove" onclick="removeItem(${index})">
                    Odebrat
                </button>
            `;

            container.appendChild(div);

        });

        totalElement.textContent =
            total.toLocaleString("cs-CZ") + " Kč";
    }


    function removeItem(index) {

        cart.splice(index, 1);

        localStorage.setItem(
            "terixCart",
            JSON.stringify(cart)
        );

        renderCart();
    }


    renderCart();

</script>

</body>
</html>
